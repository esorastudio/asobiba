<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f6f4ff">
  <meta name="description" content="すきなあそびを、すきなだけ。キーボードやタップで楽しむ、こどものための小さな遊び場。">
  <title>あそびば</title>
  <link rel="stylesheet" href="./assets/style.css">
</head>
<body>
  <header class="site-header">
    <a class="brand" href="./" aria-label="あそびば ホーム">あそびば<span aria-hidden="true"> ●</span></a>
    <span class="header-note">すきなだけ、あそぼう。</span>
  </header>

  <main>
    <div class="intro">
      <p class="eyebrow">きょうは、なにしてあそぶ？</p>
      <h1>やってみよう。<br>なんどでも。</h1>
      <p>すきなあそびを えらんでね。</p>
    </div>

    <ul class="games" aria-label="あそびのいちらん">
      <!-- あそびを増やすときは、この li を複製してリンク・画像・説明を変更します。 -->
      <li>
        <a class="game-card" href="./ponkey/" aria-labelledby="ponkey-title" aria-describedby="ponkey-description ponkey-input">
          <div class="game-art" aria-hidden="true">
            <span class="game-wordmark">PonKey!</span>
            <img src="./ponkey/assets/unicorn.png" width="256" height="256" alt="" fetchpriority="high">
            <span class="key key-p">P</span>
            <span class="key key-o">O</span>
            <span class="key key-n">N</span>
          </div>
          <div class="game-info">
            <p class="game-input" id="ponkey-input">キーボード・タップ / おとがでるよ</p>
            <h2 id="ponkey-title">ぽんぽん！ PonKey</h2>
            <p id="ponkey-description">キーをおすと、おとと もじが とびだすよ。<br>タップすると、なにがでるかな？</p>
            <span class="play">あそぶ <span aria-hidden="true">↗</span></span>
          </div>
        </a>
      </li>
    </ul>
  </main>

  <footer>ちいさな「たのしい」が、あつまるところ。</footer>
</body>
</html>
